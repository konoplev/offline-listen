[project]
name = "listen-gen"
version = "0.1.0"
description = "Transcribe audio with mlx-whisper and translate subtitles (macOS translator or LLM)"
requires-python = ">=3.11"
dependencies = [
    "mlx-whisper>=0.4",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "playwright>=1.45"]

[project.scripts]
listen-gen = "listen_gen.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["listen_gen"]

[tool.setuptools.package-data]
listen_gen = ["*.swift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["slow: real whisper model (local cache only)"]
